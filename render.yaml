services:
  - type: web
    name: stockflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-postgres
          property: connectionString
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: stockflow-postgres
    databaseName: stockflow
    user: stockflow
    region: virginia
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
