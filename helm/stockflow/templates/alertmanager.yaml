apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "alertmanager") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: alertmanager
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/name: stockflow
        app.kubernetes.io/component: alertmanager
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alertmanager
        image: {{ .Values.alertmanager.image | quote }}
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --cluster.listen-address=
        env: []
        ports:
        - name: http
          containerPort: 9093
        resources:
          {{- toYaml .Values.alertmanager.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /alertmanager
          readOnly: false
        imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: data
        persistentVolumeClaim:
          claimName: {{ default "alertmanager-data" .Values.alertmanager.storage.existingClaim | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "alertmanager") | nindent 4 }}
spec:
  selector:
    app: alertmanager
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: http
    port: 9093
    targetPort: http
---
{{- if not .Values.alertmanager.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "alertmanager") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.alertmanager.storage.size | quote }}
{{- end }}
