apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/name: stockflow
        app.kubernetes.io/component: frontend
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: {{ include "stockflow.image" .Values.frontend.image | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
        env:
        - name: VITE_API_PROXY_TARGET
          value: {{ printf "http://backend:%v" .Values.backend.ports.http | quote }}
        - name: VITE_API_BASE_URL
          value: ''
        - name: VITE_AUTH_ENABLED
          value: 'true'
        ports:
        - name: http
          containerPort: 5173
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  selector:
    app: frontend
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
  - name: http
    port: 5173
    targetPort: http
