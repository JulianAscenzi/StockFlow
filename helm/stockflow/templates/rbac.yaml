apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "prometheus") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "stockflow.labels" (dict "root" . "component" "prometheus") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
