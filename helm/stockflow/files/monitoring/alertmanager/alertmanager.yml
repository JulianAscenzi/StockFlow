global:
  resolve_timeout: 1m
route:
  receiver: local-only
  group_by: [service, alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
receivers:
  - name: local-only
# No integrations: alerts are visible locally and nothing is sent externally.
inhibit_rules:
  - source_matchers: ['alertname="StockFlowBackendNotScrapeable"']
    target_matchers: ['alertname=~"StockFlowReadinessDown|StockFlowHikariSaturated"']
    equal: [service]
  - source_matchers: ['alertname="StockFlowAvailabilityBudgetFastBurn"']
    target_matchers: ['alertname="StockFlowAvailabilityBudgetSustainedBurn"']
    equal: [service]
