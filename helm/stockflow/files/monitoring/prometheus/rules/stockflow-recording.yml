groups:
  - name: stockflow-short-windows
    interval: 15s
    rules:
      - record: "stockflow:slo_availability:target"
        expr: "vector(0.995)"
      - record: "stockflow:eligible_requests:rate5m"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[5m])) or vector(0)"
      - record: "stockflow:eligible_errors:rate5m"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[5m])) or vector(0)"
      - record: "stockflow:eligible_requests:increase5m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[5m])) or vector(0)"
      - record: "stockflow:eligible_errors:increase5m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[5m])) or vector(0)"
      - record: "stockflow:error_budget:burn_rate5m"
        expr: "(((stockflow:eligible_errors:rate5m) / (stockflow:eligible_requests:rate5m)) and ((stockflow:eligible_requests:rate5m) > 0) or on() vector(0)) / 0.005"
      - record: "stockflow:eligible_requests:rate1h"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[1h])) or vector(0)"
      - record: "stockflow:eligible_errors:rate1h"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[1h])) or vector(0)"
      - record: "stockflow:eligible_requests:increase1h"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[1h])) or vector(0)"
      - record: "stockflow:eligible_errors:increase1h"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[1h])) or vector(0)"
      - record: "stockflow:error_budget:burn_rate1h"
        expr: "(((stockflow:eligible_errors:rate1h) / (stockflow:eligible_requests:rate1h)) and ((stockflow:eligible_requests:rate1h) > 0) or on() vector(0)) / 0.005"
      - record: "stockflow:eligible_requests:rate30m"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[30m])) or vector(0)"
      - record: "stockflow:eligible_errors:rate30m"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[30m])) or vector(0)"
      - record: "stockflow:eligible_requests:increase30m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[30m])) or vector(0)"
      - record: "stockflow:eligible_errors:increase30m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[30m])) or vector(0)"
      - record: "stockflow:error_budget:burn_rate30m"
        expr: "(((stockflow:eligible_errors:rate30m) / (stockflow:eligible_requests:rate30m)) and ((stockflow:eligible_requests:rate30m) > 0) or on() vector(0)) / 0.005"
      - record: "stockflow:eligible_requests:rate6h"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[6h])) or vector(0)"
      - record: "stockflow:eligible_errors:rate6h"
        expr: "sum(rate(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[6h])) or vector(0)"
      - record: "stockflow:eligible_requests:increase6h"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[6h])) or vector(0)"
      - record: "stockflow:eligible_errors:increase6h"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[6h])) or vector(0)"
      - record: "stockflow:error_budget:burn_rate6h"
        expr: "(((stockflow:eligible_errors:rate6h) / (stockflow:eligible_requests:rate6h)) and ((stockflow:eligible_requests:rate6h) > 0) or on() vector(0)) / 0.005"
      - record: "stockflow:availability:ratio5m"
        expr: "(1 - stockflow:eligible_errors:rate5m / stockflow:eligible_requests:rate5m) and (stockflow:eligible_requests:rate5m > 0) or vector(-1)"
      - record: "stockflow:slo_latency:target"
        expr: "vector(0.95)"
        labels:
          operation: "read"
      - record: "stockflow:successful_requests:increase5m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\"}[5m])) or vector(0)"
        labels:
          operation: "read"
      - record: "stockflow:fast_requests:increase5m"
        expr: "sum(increase(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\",le=\"0.5\"}[5m])) or vector(0)"
        labels:
          operation: "read"
      - record: "stockflow:latency:ratio5m"
        expr: "((stockflow:fast_requests:increase5m{operation=\"read\"}) / (stockflow:successful_requests:increase5m{operation=\"read\"})) and ((stockflow:successful_requests:increase5m{operation=\"read\"}) > 0) or on() vector(-1)"
        labels:
          operation: "read"
      - record: "stockflow:latency:p50_seconds5m"
        expr: "histogram_quantile(0.5,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"read\"} > 0) or vector(-1)"
        labels:
          operation: "read"
      - record: "stockflow:latency:p95_seconds5m"
        expr: "histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"read\"} > 0) or vector(-1)"
        labels:
          operation: "read"
      - record: "stockflow:latency:p99_seconds5m"
        expr: "histogram_quantile(0.99,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"read\"} > 0) or vector(-1)"
        labels:
          operation: "read"
      - record: "stockflow:slo_latency:target"
        expr: "vector(0.95)"
        labels:
          operation: "sale"
      - record: "stockflow:successful_requests:increase5m"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\"}[5m])) or vector(0)"
        labels:
          operation: "sale"
      - record: "stockflow:fast_requests:increase5m"
        expr: "sum(increase(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\",le=\"1.0\"}[5m])) or vector(0)"
        labels:
          operation: "sale"
      - record: "stockflow:latency:ratio5m"
        expr: "((stockflow:fast_requests:increase5m{operation=\"sale\"}) / (stockflow:successful_requests:increase5m{operation=\"sale\"})) and ((stockflow:successful_requests:increase5m{operation=\"sale\"}) > 0) or on() vector(-1)"
        labels:
          operation: "sale"
      - record: "stockflow:latency:p50_seconds5m"
        expr: "histogram_quantile(0.5,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"sale\"} > 0) or vector(-1)"
        labels:
          operation: "sale"
      - record: "stockflow:latency:p95_seconds5m"
        expr: "histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"sale\"} > 0) or vector(-1)"
        labels:
          operation: "sale"
      - record: "stockflow:latency:p99_seconds5m"
        expr: "histogram_quantile(0.99,sum by(le)(rate(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\"}[5m]))) and on() (stockflow:successful_requests:increase5m{operation=\"sale\"} > 0) or vector(-1)"
        labels:
          operation: "sale"
      - record: "stockflow:slow_sale_requests:increase5m"
        expr: "stockflow:successful_requests:increase5m{operation=\"sale\"} - stockflow:fast_requests:increase5m{operation=\"sale\"}"
  - name: stockflow-rolling-objectives
    interval: 1m
    rules:
      - record: "stockflow:eligible_requests:increase30d"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[235]..\"}[30d])) or vector(0)"
      - record: "stockflow:eligible_errors:increase30d"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"5..\"}[30d])) or vector(0)"
      - record: "stockflow:availability:ratio30d"
        expr: "(1 - stockflow:eligible_errors:increase30d / stockflow:eligible_requests:increase30d) and (stockflow:eligible_requests:increase30d > 0) or vector(-1)"
      - record: "stockflow:error_budget:total30d"
        expr: "stockflow:eligible_requests:increase30d * 0.005"
      - record: "stockflow:error_budget:consumed_ratio30d"
        expr: "((stockflow:eligible_errors:increase30d) / (stockflow:error_budget:total30d)) and ((stockflow:error_budget:total30d) > 0) or on() vector(-1)"
      - record: "stockflow:error_budget:remaining_ratio30d"
        expr: "clamp_min(1 - stockflow:error_budget:consumed_ratio30d, 0) and (stockflow:error_budget:total30d > 0) or vector(-1)"
      - record: "stockflow:slo_history:coverage30d"
        expr: "count_over_time(stockflow:eligible_requests:rate5m[30d]) / 172800"
      - record: "stockflow:successful_requests:increase30d"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\"}[30d])) or vector(0)"
        labels:
          operation: "read"
      - record: "stockflow:fast_requests:increase30d"
        expr: "sum(increase(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/dashboard|/api/sales|/api/sales/\\\\{id\\\\}|/api/categories|/api/categories/\\\\{id\\\\}|/api/products|/api/products/\\\\{id\\\\}|/api/products/(lookup|search|active)|/api/products/\\\\{id\\\\}/(activate|deactivate)|/api/products/category/\\\\{categoryId\\\\}|/api/products/\\\\{productId\\\\}/(stock/(in|out)|stock-movements)\",status=~\"[23]..\",method=\"GET\",le=\"0.5\"}[30d])) or vector(0)"
        labels:
          operation: "read"
      - record: "stockflow:latency:ratio30d"
        expr: "((stockflow:fast_requests:increase30d{operation=\"read\"}) / (stockflow:successful_requests:increase30d{operation=\"read\"})) and ((stockflow:successful_requests:increase30d{operation=\"read\"}) > 0) or on() vector(-1)"
        labels:
          operation: "read"
      - record: "stockflow:successful_requests:increase30d"
        expr: "sum(increase(http_server_requests_seconds_count{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\"}[30d])) or vector(0)"
        labels:
          operation: "sale"
      - record: "stockflow:fast_requests:increase30d"
        expr: "sum(increase(http_server_requests_seconds_bucket{job=\"stockflow\",uri=~\"/api/sales\",status=~\"[23]..\",method=\"POST\",le=\"1.0\"}[30d])) or vector(0)"
        labels:
          operation: "sale"
      - record: "stockflow:latency:ratio30d"
        expr: "((stockflow:fast_requests:increase30d{operation=\"sale\"}) / (stockflow:successful_requests:increase30d{operation=\"sale\"})) and ((stockflow:successful_requests:increase30d{operation=\"sale\"}) > 0) or on() vector(-1)"
        labels:
          operation: "sale"
