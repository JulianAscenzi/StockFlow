# Only enabled in the local Compose environment; public demo keeps health only.
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Exact thresholds for successful read and sale latency SLIs, not custom timers.
management.metrics.distribution.slo.http.server.requests=500ms,1s
