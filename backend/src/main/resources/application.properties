spring.application.name=stockflow-backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.auth.enabled=${APP_AUTH_ENABLED:true}
app.auth.admin.email=${APP_ADMIN_EMAIL:admin@stockflow.local}
app.auth.admin.password=${APP_ADMIN_PASSWORD}
app.auth.jwt.secret=${APP_JWT_SECRET}
app.auth.jwt.expiration=PT8H
