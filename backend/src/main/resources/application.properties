spring.application.name=stockflow-backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health
# Fit connection acquisition/validation within the Compose healthcheck's 4s HTTP budget.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
# Boot already defaults to graceful shutdown; keep its 30s phase budget explicit.
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
app.auth.enabled=${APP_AUTH_ENABLED:true}
app.auth.admin.email=${APP_ADMIN_EMAIL:admin@stockflow.local}
app.auth.admin.password=${APP_ADMIN_PASSWORD}
app.auth.jwt.secret=${APP_JWT_SECRET}
app.auth.jwt.expiration=PT8H
