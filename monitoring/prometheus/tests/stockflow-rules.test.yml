rule_files:
- ../rules/stockflow-recording.yml
- ../rules/stockflow-alerts.yml
evaluation_interval: 15s
tests:
- name: eligible routes normalized; health auth and 4xx excluded
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/products/{id}",method="GET",status="200"}
    values: 0+99x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="503"}
    values: 0+1x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/products/{id}",method="GET",status="404"}
    values: 0+500x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/sales",method="POST",status="409"}
    values: 0+500x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/actuator/prometheus",method="GET",status="500"}
    values: 0+500x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/auth/login",method="POST",status="500"}
    values: 0+500x40
  promql_expr_test:
  - expr: stockflow:availability:ratio5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:availability:ratio5m"}'
      value: 0.99
  - expr: stockflow:error_budget:burn_rate5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:error_budget:burn_rate5m"}'
      value: 2
  - expr: stockflow:eligible_requests:rate5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:eligible_requests:rate5m"}'
      value: 6.666666666666667
  - expr: stockflow:eligible_errors:rate5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:eligible_errors:rate5m"}'
      value: 0.06666666666666667
  - expr: stockflow:error_budget:consumed_ratio30d
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:error_budget:consumed_ratio30d"}'
      value: 2
  - expr: stockflow:error_budget:remaining_ratio30d
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:error_budget:remaining_ratio30d"}'
      value: 0
- name: idle traffic is unknown; no fake availability
  interval: 15s
  input_series: []
  promql_expr_test:
  - expr: stockflow:availability:ratio5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:availability:ratio5m"}'
      value: -1
  - expr: stockflow:error_budget:burn_rate5m
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:error_budget:burn_rate5m"}'
      value: 0
  - expr: stockflow:error_budget:remaining_ratio30d
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:error_budget:remaining_ratio30d"}'
      value: -1
  - expr: stockflow:latency:p95_seconds5m{operation="sale"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:latency:p95_seconds5m",operation="sale"}'
      value: -1
  alert_rule_test:
  - eval_time: 5m
    alertname: StockFlowAvailabilityBudgetFastBurn
    exp_alerts: []
- name: fast burn needs for and sustained errors
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="200"}
    values: 0+4x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="503"}
    values: 0+2x40
  alert_rule_test:
  - eval_time: 1m
    alertname: StockFlowAvailabilityBudgetFastBurn
    exp_alerts: []
  - eval_time: 4m
    alertname: StockFlowAvailabilityBudgetFastBurn
    exp_alerts:
    - exp_labels:
        severity: critical
        service: stockflow
      exp_annotations:
        summary: Fast availability budget consumption
        description: More than 6% eligible errors in both 1h and 5m windows; monthly budget at risk.
        action: Check readiness, DB and 5xx routes before restarting.
        runbook_url: docs/RUNBOOK.md#disponibilidad-degradada
- name: one error cannot page despite tiny traffic
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="200"}
    values: 0+0x40
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="503"}
    values: 0 1+0x39
  alert_rule_test:
  - eval_time: 5m
    alertname: StockFlowAvailabilityBudgetFastBurn
    exp_alerts: []
  - eval_time: 5m
    alertname: StockFlowAvailabilityBudgetSustainedBurn
    exp_alerts: []
- name: slow burn sustained
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="200"}
    values: 0+97x80
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="503"}
    values: 0+3x80
  alert_rule_test:
  - eval_time: 5m
    alertname: StockFlowAvailabilityBudgetSustainedBurn
    exp_alerts: []
  - eval_time: 15m
    alertname: StockFlowAvailabilityBudgetSustainedBurn
    exp_alerts:
    - exp_labels:
        severity: warning
        service: stockflow
      exp_annotations:
        summary: Sustained availability budget consumption
        description: More than 2% eligible errors in both 6h and 30m windows.
        action: Investigate recurring errors and recent changes.
        runbook_url: docs/RUNBOOK.md#disponibilidad-degradada
- name: backend down resolves after recovery
  interval: 15s
  input_series:
  - series: up{job="stockflow",instance="backend-management:9091"}
    values: 1 0+0x8 1+0x12
  alert_rule_test:
  - eval_time: 30s
    alertname: StockFlowBackendNotScrapeable
    exp_alerts: []
  - eval_time: 2m
    alertname: StockFlowBackendNotScrapeable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: stockflow
        job: stockflow
        instance: backend-management:9091
      exp_annotations:
        summary: StockFlow cannot be scraped
        description: Backend may be stopped or management listener/network unavailable; HTTP SLI cannot measure requests that
          never arrive.
        action: Check container, Prometheus target error and internal network.
        runbook_url: docs/RUNBOOK.md#backend-no-scrapeable
  - eval_time: 3m
    alertname: StockFlowBackendNotScrapeable
    exp_alerts: []
- name: latency threshold and percentile recording retain operation labels
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/sales",method="POST",status="201"}
    values: 0+10x80
  - series: http_server_requests_seconds_bucket{job="stockflow",uri="/api/sales",method="POST",status="201",le="1.0"}
    values: 0+9x80
  - series: http_server_requests_seconds_bucket{job="stockflow",uri="/api/sales",method="POST",status="201",le="2.0"}
    values: 0+10x80
  - series: http_server_requests_seconds_bucket{job="stockflow",uri="/api/sales",method="POST",status="201",le="+Inf"}
    values: 0+10x80
  promql_expr_test:
  - expr: stockflow:latency:ratio5m{operation="sale"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:latency:ratio5m",operation="sale"}'
      value: 0.9
  - expr: stockflow:latency:p95_seconds5m{operation="sale"}
    eval_time: 5m
    exp_samples:
    - labels: '{__name__="stockflow:latency:p95_seconds5m",operation="sale"}'
      value: 1.5
  alert_rule_test:
  - eval_time: 3m
    alertname: StockFlowSaleLatencyDegraded
    exp_alerts: []
  - eval_time: 8m
    alertname: StockFlowSaleLatencyDegraded
    exp_alerts:
    - exp_labels:
        severity: warning
        service: stockflow
        operation: sale
      exp_annotations:
        summary: Successful sales exceed latency objective
        description: More than 5% successful confirmations take over 1s, with multiple slow requests and sustained traffic.
        action: Inspect DB locks, transaction duration and pool waiting.
        runbook_url: docs/RUNBOOK.md#alta-latencia
- name: StockFlowReadinessDown sustained
  interval: 15s
  input_series:
  - series: stockflow_readiness{job="stockflow",instance="backend-management:9091"}
    values: 0+0x40
  - series: stockflow_readiness_checked_timestamp_seconds{job="stockflow",instance="backend-management:9091"}
    values: 0+15x40
  - series: up{job="stockflow",instance="backend-management:9091"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 30s
    alertname: StockFlowReadinessDown
    exp_alerts: []
  - eval_time: 3m
    alertname: StockFlowReadinessDown
    exp_alerts:
    - exp_labels:
        severity: critical
        service: stockflow
        job: stockflow
        instance: backend-management:9091
      exp_annotations:
        summary: StockFlow is alive but not ready
        description: The DB or readiness state prevents normal business operations.
        action: Check PostgreSQL health, connection logs and Hikari timeouts.
        runbook_url: docs/RUNBOOK.md#db-unavailable
- name: StockFlowHikariSaturated sustained
  interval: 15s
  input_series:
  - series: hikaricp_connections_pending{job="stockflow",instance="backend-management:9091",pool="HikariPool-1"}
    values: 2+0x40
  - series: hikaricp_connections_active{job="stockflow",instance="backend-management:9091",pool="HikariPool-1"}
    values: 10+0x40
  - series: hikaricp_connections_max{job="stockflow",instance="backend-management:9091",pool="HikariPool-1"}
    values: 10+0x40
  - series: up{job="stockflow",instance="backend-management:9091"}
    values: 1+0x40
  alert_rule_test:
  - eval_time: 30s
    alertname: StockFlowHikariSaturated
    exp_alerts: []
  - eval_time: 3m
    alertname: StockFlowHikariSaturated
    exp_alerts:
    - exp_labels:
        severity: warning
        service: stockflow
        job: stockflow
        instance: backend-management:9091
        pool: HikariPool-1
      exp_annotations:
        summary: Database connection pool is saturated
        description: Requests are waiting while at least 90% of pool capacity is occupied.
        action: Inspect slow queries and locks; do not blindly increase pool size.
        runbook_url: docs/RUNBOOK.md#hikari-saturado
- name: sustained warning cannot start late after recent errors stop
  interval: 15s
  input_series:
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="200"}
    values: 0+10x80
  - series: http_server_requests_seconds_count{job="stockflow",uri="/api/dashboard",method="GET",status="503"}
    values: 0+3x20 60+0x60
  alert_rule_test:
  - eval_time: 15m
    alertname: StockFlowAvailabilityBudgetSustainedBurn
    exp_alerts: []
fuzzy_compare: true
