apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stockflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: stockflow-frontend:stage5-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: VITE_API_PROXY_TARGET
              value: http://backend:8080
            - name: VITE_API_BASE_URL
              value: ""
            - name: VITE_AUTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockflow
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
