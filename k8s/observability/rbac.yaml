apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: stockflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: stockflow
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: stockflow
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: stockflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
