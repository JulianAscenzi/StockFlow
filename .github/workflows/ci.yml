name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - run: docker info
      - name: Backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DfailIfNoTests=true clean test
      - name: Require executed tests without omissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('backend/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'Missing test reports'
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          assert totals['tests'] > 0 and all(totals[k] == 0 for k in ('failures', 'errors', 'skipped')), totals
          print(totals)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Compile frontend
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | tee frontend-build.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: frontend-diagnostics
          path: frontend-build.log
          retention-days: 7

  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/.mvn/wrapper/maven-wrapper.properties
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker info
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-reports
          path: |
            backend/target/surefire-reports/
            backend/target/browser-e2e.log
            frontend/test-results/
          retention-days: 7
          if-no-files-found: error

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Artifact integrity tests
        run: python3 -m unittest discover -s scripts/tests -p test_image_artifact.py -v
      - name: Image coordinates and source timestamp
        id: source
        env:
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=''
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected stable vX.Y.Z tag' >&2; exit 1; }
            version="${REF_NAME#v}"
          fi
          echo "repository=ghcr.io/${OWNER,,}/stockflow-$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/image"
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.source.outputs.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.created }}
      - name: Build OCI image with attestations (never push here)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=oci,dest=${{ runner.temp }}/image/image.tar,rewrite-timestamp=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=stockflow-${{ matrix.component }}-amd64
          cache-to: type=gha,scope=stockflow-${{ matrix.component }}-amd64,mode=max
      - name: Record and verify OCI digest, SBOM and provenance
        env:
          METADATA: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ steps.source.outputs.repository }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          printf '%s' "$METADATA" > "$RUNNER_TEMP/image/metadata.json"
          python3 scripts/image-artifact.py record "$RUNNER_TEMP/image" \
            --metadata "$RUNNER_TEMP/image/metadata.json" --digest "$DIGEST" \
            --repository "$REPOSITORY" --commit "$GITHUB_SHA" --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: oci-${{ matrix.component }}
          path: ${{ runner.temp }}/image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/image/image.json
            ${{ runner.temp }}/image/sbom.spdx.json
            ${{ runner.temp }}/image/provenance.json
          retention-days: 30
          if-no-files-found: error

  image-smoke:
    needs: [images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.8.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/download-artifact@v8
        with:
          pattern: oci-*
          path: ${{ runner.temp }}/images
      - name: Load exact OCI artifacts and smoke-test integration
        run: |
          set -euo pipefail
          for component in backend frontend; do
            python3 scripts/image-artifact.py load "$RUNNER_TEMP/images/oci-$component"
          done
          docker pull postgres:17-alpine
          backend=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tags"][0])' "$RUNNER_TEMP/images/oci-backend/image.json")
          frontend=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tags"][0])' "$RUNNER_TEMP/images/oci-frontend/image.json")
          python3 scripts/image-smoke.py --backend "$backend" --frontend "$frontend" --output "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: image-smoke-reports
          path: ${{ runner.temp }}/smoke/
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: [backend, frontend, browser, images, image-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.8.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v4
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit:v0.33.1
      - uses: actions/download-artifact@v8
        with:
          name: oci-${{ matrix.component }}
          path: ${{ runner.temp }}/image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested OCI index and verify registry digest
        id: publish
        run: python3 scripts/image-artifact.py publish "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@v7
        with:
          name: published-${{ matrix.component }}
          path: ${{ runner.temp }}/image/image.json
          retention-days: 30
          if-no-files-found: error
